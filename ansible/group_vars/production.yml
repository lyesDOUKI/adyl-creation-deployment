---
project_name: adyl-creation

deploy_user: user-deploy
ssh_port: 22
app_root: /opt/adyl-creation
docker_directory: "{{ app_root }}/docker"
certbot_webroot: "{{ app_root }}/certbot/www"

# =========================================================================
# sslip.io
# =========================================================================
# sslip.io derives DNS records from the VPS public IPv4 address.
#
# Example for 203.0.113.50:
#   Frontend:  adyl-creation.203.0.113.50.sslip.io
#   API:       api.203.0.113.50.sslip.io
#   Keycloak:  auth.203.0.113.50.sslip.io
#
# VPS_HOST is passed by GitHub Actions as vps_ipv4.
# =========================================================================

sslip_domain_suffix: "{{ vps_ipv4 }}.sslip.io"

app_hostname: "adyl.{{ sslip_domain_suffix }}"
api_hostname: "api.{{ sslip_domain_suffix }}"
keycloak_hostname: "auth.{{ sslip_domain_suffix }}"

# =========================================================================
# Reverse proxy
# =========================================================================

http_port: 80
https_port: 443

# =========================================================================
# Application
# =========================================================================

server_port: 8084

app_base_url: "https://{{ app_hostname }}"

app_photos_storage_path: "/data/photos"

spring_profile: "docker"

# =========================================================================
# Application database
# =========================================================================

db_host: "postgres"
db_port: 5432
db_name: "adyl-creation"

# =========================================================================
# PostgreSQL container
# =========================================================================

postgres_version: "17.10"

# =========================================================================
# Keycloak
# =========================================================================

keycloak_version: "26.7.2"

keycloak_image: "quay.io/keycloak/keycloak:26.7.2"

keycloak_realm: "adyl-creation"

# =========================================================================
# OIDC
# =========================================================================

oidc_issuer_uri: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}"

oidc_authorization_url: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}/protocol/openid-connect/auth"

oidc_token_url: "https://{{ keycloak_hostname }}/realms/{{ keycloak_realm }}/protocol/openid-connect/token"

oidc_audience: "adyl-creation-api"

# =========================================================================
# Healthchecks
# =========================================================================

postgres_healthcheck_interval: "10s"
postgres_healthcheck_timeout: "5s"
postgres_healthcheck_retries: 10

keycloak_db_healthcheck_interval: "10s"
keycloak_db_healthcheck_timeout: "5s"
keycloak_db_healthcheck_retries: 10

keycloak_healthcheck_interval: "15s"
keycloak_healthcheck_timeout: "5s"
keycloak_healthcheck_retries: 20
keycloak_healthcheck_start_period: "30s"

# =========================================================================
# Mailing - Brevo SMTP
# =========================================================================
# MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM /
# ADMIN_EMAIL are supplied through GitHub Secrets.
# =========================================================================

mailing_enabled: true

# =========================================================================
# Container images
# =========================================================================
# Keep versions pinned in production.
# Update these values when releasing a new version.
# =========================================================================

frontend_image: "ghcr.io/lyesdouki/adyl-creation-front:latest"
api_image: "ghcr.io/lyesdouki/adyl-creation-api:latest"

# =========================================================================
# GHCR
# =========================================================================

ghcr_enabled: false
ghcr_registry: "ghcr.io"

ghcr_username: ""
ghcr_token: ""

# =========================================================================
# Secrets
# =========================================================================
# These values are injected by GitHub Actions.
# They must never be committed to Git.
# =========================================================================

postgres_user: ""
postgres_password: ""

keycloak_db_name: "keycloak"
keycloak_db_user: ""
keycloak_db_password: ""

keycloak_admin_username: ""
keycloak_admin_password: ""

mail_host: ""
mail_port: ""
mail_username: ""
mail_password: ""
mail_from: ""
admin_email: ""

# =========================================================================
# Optional Java truststore
# =========================================================================

api_truststore_enabled: false
api_truststore_source: ""
api_truststore_password: "changeit"

# =========================================================================
# Additional application environment variables
# =========================================================================

application_extra_environment: {}

application_env_content: ""

# =========================================================================
# TLS
# =========================================================================

application_tls_enabled: true

letsencrypt_email: "CHANGE_ME"
letsencrypt_staging: ""
letsencrypt_certificate_name: "adyl-creation.{{ sslip_domain_suffix }}"

letsencrypt_domains:
  - "{{ app_hostname }}"
  - "{{ api_hostname }}"
  - "{{ keycloak_hostname }}"