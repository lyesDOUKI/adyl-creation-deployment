---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
      - fail2ban
      - certbot
      - python3
      - python3-apt
      - python3-docker
    state: present

- name: Create application root
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Create Docker directory
  ansible.builtin.file:
    path: "{{ docker_directory }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Create Certbot webroot
  ansible.builtin.file:
    path: "{{ certbot_webroot }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Create Docker Nginx directory
  ansible.builtin.file:
    path: "{{ docker_directory }}/nginx"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Configure deployment sudo access
  ansible.builtin.include_tasks:
    file: sudoers.yml
