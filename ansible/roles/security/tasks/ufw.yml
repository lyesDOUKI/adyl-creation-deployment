---
- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "{{ http_port }}"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ https_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "on"
