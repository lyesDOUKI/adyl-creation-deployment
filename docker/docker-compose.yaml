services:

  # =========================================================================
  # REVERSE PROXY
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: adyl-creation-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro

    depends_on:
      - frontend
      - api
      - keycloak

    networks:
      - proxy

  # =========================================================================
  # FRONTEND
  # =========================================================================
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: adyl-creation-frontend
    restart: unless-stopped

    expose:
      - "80"

    networks:
      - proxy

  # =========================================================================
  # BACKEND API
  # =========================================================================
  api:
    image: ${API_IMAGE}
    container_name: adyl-creation-api
    restart: unless-stopped

    expose:
      - "8080"

    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}

      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://${KEYCLOAK_HOSTNAME}/realms/${KEYCLOAK_REALM}
      - ${APPLICATION_EXTRA_ENVIRONMENT}

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

    networks:
      - proxy
      - data

  # =========================================================================
  # APPLICATION DATABASE
  # =========================================================================
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    container_name: adyl-creation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ../data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data

  # =========================================================================
  # KEYCLOAK DATABASE
  # =========================================================================
  keycloak-db:
    image: postgres:${KEYCLOAK_DB_IMAGE_TAG:-17-alpine}
    container_name: adyl-creation-keycloak-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - ../data/keycloak:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data

  # =========================================================================
  # KEYCLOAK
  # =========================================================================
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.2}
    container_name: adyl-creation-keycloak
    restart: unless-stopped

    command:
      - start
      - --http-enabled=true
      - --hostname=${KEYCLOAK_HOSTNAME}
      - --proxy-headers=xforwarded
      - --health-enabled=true

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    depends_on:
      keycloak-db:
        condition: service_healthy

    expose:
      - "8080"

    networks:
      - proxy
      - data

# ===========================================================================
# NETWORKS
# ===========================================================================

networks:

  proxy:
    name: adyl-creation-proxy

  data:
    name: adyl-creation-data
    internal: true